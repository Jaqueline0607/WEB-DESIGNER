<!-- Start page content --> 
<div class="container">        
    <div class="row mt-0 mb-4 my-md-5 overflow-hidden"> 
        <div class="col-12 col-md-10 offset-md-1 col-lg-8 offset-lg-2 text-center">
            <h3 class="font-35 font-weight-bold fables-second-text-color mb-3">Entre em Contato</h3>
        </div>  
    </div>    

    <div class="row">
        <div class="col-12 wow fadeInLeft">
            <form class="fables-contact-form" id="contactForm">

				<!-- Nome e Sobrenome -->
				<div class="form-row">
					<div class="form-group col-md-6">
						<input type="text" id="nome" class="form-control p-3 fables-rounded" placeholder="Nome" required>
					</div>
					<div class="form-group col-md-6">
						<input type="text" id="sobrenome" class="form-control p-3 fables-rounded" placeholder="Sobrenome" required>
					</div>
				</div>

				<!-- Email e Telefone -->
				<div class="form-row">
					<div class="form-group col-md-6">
						<input type="email" id="email" class="form-control p-3 fables-rounded" placeholder="E-mail" required>
					</div>
					<div class="form-group col-md-6">
						<input type="tel" id="telefone" class="form-control p-3 fables-rounded" placeholder="Telefone (opcional)">
					</div>
				</div>

				<!-- Avaliação -->
				<div class="form-row">
					<div class="form-group col-md-12 text-center">
						<label class="white-color font-weight-bold mb-2"><i>Avalie o site</i></label>

						<div class="rating">
							<input type="radio" id="star5" name="rating" value="5">
							<label for="star5">★</label>

							<input type="radio" id="star4" name="rating" value="4">
							<label for="star4">★</label>

							<input type="radio" id="star3" name="rating" value="3">
							<label for="star3">★</label>

							<input type="radio" id="star2" name="rating" value="2">
							<label for="star2">★</label>

							<input type="radio" id="star1" name="rating" value="1">
							<label for="star1">★</label>
						</div>
					</div>
				</div>

				<!-- Mensagem -->
				<div class="form-row">
					<div class="form-group col-md-12">
						<textarea id="mensagem" class="form-control p-3 fables-rounded" placeholder="Mensagem" rows="4" style="resize: none;"></textarea>
					</div>
				</div>

				<!-- Botão -->
				<div class="form-row">
					<div class="col-md-12 text-center">
						<button type="submit" class="btn fables-second-background-color text-white 
						fables-btn-rounded px-7 py-2 font-20">
							Enviar
						</button>
					</div>
				</div>

            </form>
        </div>
    </div>
</div>
